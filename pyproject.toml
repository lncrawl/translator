[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "lncrawl-translator"
version = "0.2.0"
description = "Stateless web-novel translation service with switchable engines"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Lightnovel Crawler", email = "lncrawl@pm.me" },
]
keywords = ["translation", "webnovel", "lightnovel", "llm", "fastapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: Chinese (Traditional)",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langdetect>=1.0.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "eval-type-backport>=0.2; python_version < '3.10'",
]

[project.optional-dependencies]
server = [
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "fastapi[standard]>=0.115",
  "httpx2<=2.7.0",
  "mypy>=1.11",
  "poethepoet>=0.30",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml",
  "uvicorn>=0.30",
]

[tool.poe.tasks]
lint = [{ cmd = "ruff check . --fix" }, { cmd = "ruff format ." }]
lint-check = [{ cmd = "ruff check ." }, { cmd = "ruff format --check ." }]
typecheck = "mypy"
test = "pytest -q"
coverage = "pytest --cov=translator --cov-report=xml --cov-report=term-missing"
check = ["lint", "typecheck", "test"]
dev = "fastapi dev translator/main.py --port 8184"
start = "uvicorn translator.main:app --host 0.0.0.0 --port 8184"
docker = "docker compose up -d --build"
# Exercises every enabled engine in config.yml with two tiny real calls.
live-test = { cmd = "pytest tests/test_live.py -s", env = { LIVE_ENGINE_TEST = "1" } }

[tool.hatch.build.targets.wheel]
packages = ["translator"]

[tool.hatch.build.targets.sdist]
include = ["translator", "README.md"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["translator"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.9"
strict = true
files = ["translator"]

[[tool.mypy.overrides]]
module = ["bs4.*", "langdetect.*"]
ignore_missing_imports = true
